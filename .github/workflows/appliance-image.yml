# USB appliance image: build, sign and publish to macgaver/znas-usb-appliance.
#
# ── TO SHIP A NEW APPLIANCE IMAGE, EDIT THE VALUES BELOW AND PUSH. ──
# A push that changes this file (or anything under usbimage/) builds an image
# only when there is something new to ship, so any other edit is a no-op:
#   - release v<APPLIANCE_UBUNTU_VERSION>-<APPLIANCE_BUILD> does not exist yet
#     on the appliance repo, or
#   - APPLIANCE_INCUS_VERSION differs from the Incus version recorded in the
#     newest release for this Ubuntu version: the next free build number is
#     then built automatically (26.04.1-3 -> 26.04.1-4), no need to bump
#     APPLIANCE_BUILD by hand.
#
#   APPLIANCE_UBUNTU_VERSION  Ubuntu point release the image is built from.
#                             Ubuntu's archive only serves the CURRENT point
#                             release, so this must match what the mirror
#                             delivers today — build.sh fails the build if
#                             the rootfs reports anything else.
#                             A new major (e.g. 28.04) also needs
#                             UBUNTU_CODENAME updated in usbimage/conf.sh.
#   APPLIANCE_BUILD           Our build number (the last digit). Bump it to
#                             ship a new image on the same Ubuntu release;
#                             reset it to 1 when the Ubuntu version changes.
#                             It is a minimum: an Incus change may build a
#                             higher number (see above).
#   APPLIANCE_INCUS_VERSION   Incus release baked into the image (x.y or
#                             x.y.z, e.g. 7.5.1), installed at exactly that
#                             version from the Incus project's own packages
#                             (Zabbly, "stable" channel) instead of Ubuntu's
#                             archive, which stays on the 6.0 line for the
#                             life of the release. The check job fails early
#                             when Zabbly does not publish that version for
#                             the image's Ubuntu codename. Each release's
#                             notes record the Incus version it shipped —
#                             that line is what the comparison reads.
#                             CAUTION: Incus upgrades its database on first
#                             start and an older Incus cannot read it back, so
#                             only ever move this value forward.
#
# Result: znas-usb-appliance-v26-04-1-3.iso (+ .sha256 + cosign .sig) on
# release v26.04.1-3 — what the portal's USB Appliance Upgrades card reads.
#
# Needs:
#   - a self-hosted runner labelled `usbbuild` in the build VM (root or
#     passwordless sudo, git, gh, cosign, KVM, ~30 GB free in /srv/usbbuild,
#     and the last MinIO binaries in /srv/usbbuild/minio-cache);
#   - secrets CODE_SIGN_PRIVATE_KEY + COSIGN_PASSWORD (already used by the
#     binary release) and APPLIANCE_PUBLISH_TOKEN: a fine-grained PAT limited
#     to macgaver/znas-usb-appliance with Contents: read and write — this
#     repo's GITHUB_TOKEN cannot create releases on another repo.
name: Appliance image

env:
  APPLIANCE_UBUNTU_VERSION: "26.04.1"
  APPLIANCE_BUILD: "3"
  APPLIANCE_INCUS_VERSION: "7.5.1"
  APPLIANCE_REPO: macgaver/znas-usb-appliance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/appliance-image.yml
      # A fix to the image build retries a release that failed to publish;
      # once the release exists the check job turns any push into a no-op.
      - usbimage/**
  workflow_dispatch:   # manual retry of a failed build (same skip rule applies)

permissions:
  contents: read

concurrency:
  group: appliance-image
  cancel-in-progress: false

jobs:
  # Cheap gate on a GitHub-hosted runner, so the build VM only wakes up when
  # there is a new version to build.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      appliance_build: ${{ steps.decide.outputs.appliance_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: usbimage/conf.sh
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.APPLIANCE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$APPLIANCE_UBUNTU_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::APPLIANCE_UBUNTU_VERSION must be x.y.z (26.04 is 26.04.0)"; exit 1; }
          [[ "$APPLIANCE_BUILD" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::APPLIANCE_BUILD must be a positive integer"; exit 1; }
          [[ "$APPLIANCE_INCUS_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || { echo "::error::APPLIANCE_INCUS_VERSION must be x.y or x.y.z (e.g. 7.5.1)"; exit 1; }
          [ -n "${GH_TOKEN:-}" ] \
            || { echo "::error::secret APPLIANCE_PUBLISH_TOKEN is not set in this repository"; exit 1; }
          if [ ! -f usbimage/conf.sh ]; then
            echo "::notice::usbimage/ is not in the repo yet — nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # The Incus version must exist on Zabbly for the image's codename,
          # or the build would fail an hour in.
          codename=$(sed -n 's/^UBUNTU_CODENAME="\([a-z]*\)".*/\1/p' usbimage/conf.sh)
          [ -n "$codename" ] || { echo "::error::cannot read UBUNTU_CODENAME from usbimage/conf.sh"; exit 1; }
          index="https://pkgs.zabbly.com/incus/stable/dists/$codename/main/binary-amd64/Packages"
          avail=$(curl -fsSL "$index" | awk '/^Package: incus$/{p=1} p&&/^Version:/{print $2; p=0}' \
            | sed -n 's/^[0-9]*:\([0-9.]*\)-.*/\1/p' | sort -uV)
          [ -n "$avail" ] || { echo "::error::could not read the Incus package list at $index"; exit 1; }
          if ! grep -qx "$APPLIANCE_INCUS_VERSION" <<<"$avail"; then
            echo "::error::Incus $APPLIANCE_INCUS_VERSION is not published for $codename on Zabbly. Available: $(echo $avail)"
            exit 1
          fi

          # Newest release already published for this Ubuntu version, and the
          # Incus version its notes recorded ("" when it predates the record:
          # those images carried Ubuntu's Incus, so they count as different).
          prefix="v${APPLIANCE_UBUNTU_VERSION}-"
          last=$(gh release list --repo "$APPLIANCE_REPO" --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n "s/^${prefix//./\\.}\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n1)
          build="$APPLIANCE_BUILD"
          if [ -n "$last" ]; then
            shipped=$(gh release view "${prefix}${last}" --repo "$APPLIANCE_REPO" --json body --jq .body \
              | sed -n 's/.*Incus \*\*\([0-9][0-9.]*\)\*\*.*/\1/p' | head -n1)
            if [ "$shipped" != "$APPLIANCE_INCUS_VERSION" ] && [ "$build" -le "$last" ]; then
              build=$((last + 1))
              echo "::notice::Incus ${shipped:-from the Ubuntu archive} in ${prefix}${last} -> $APPLIANCE_INCUS_VERSION: building build $build"
            fi
          fi

          v="${APPLIANCE_UBUNTU_VERSION}-${build}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "appliance_build=$build" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$APPLIANCE_REPO" >/dev/null 2>&1; then
            echo "::notice::release v$v already exists on $APPLIANCE_REPO with Incus $APPLIANCE_INCUS_VERSION — nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::building appliance image v$v (Incus $APPLIANCE_INCUS_VERSION)"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, linux, usbbuild]
    timeout-minutes: 240
    env:
      # May be higher than the value at the top when the Incus version moved.
      APPLIANCE_BUILD: ${{ needs.check.outputs.appliance_build }}
    steps:
      - uses: actions/checkout@v4

      # The portal is built from THIS commit, so the image carries exactly the
      # code it was built from — not whatever release happens to be latest
      # (which can lag far behind main). It needs no signature of its own: the
      # whole image is signed below.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the portal
        run: |
          set -euo pipefail
          version=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/version/version.go)
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X zfsnas/internal/version.Version=$version" \
            -o "$RUNNER_TEMP/bin/zfsnas" .
          "$RUNNER_TEMP/bin/zfsnas" --version
          echo "IMAGE_VERSION=$version" >> "$GITHUB_ENV"
          # The same public key the portal embeds (strip the Go raw-string
          # wrapper around the PEM block) — used to check the signature below.
          sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' internal/updater/pubkey.go \
            | sed -e 's/`$//' -e 's/^.*`//' > "$RUNNER_TEMP/cosign.pub"

      - name: Build and boot-test the image
        run: |
          set -euo pipefail
          cd usbimage
          # UBUNTU_VERSION makes build.sh fail if the mirror delivered another
          # point release than the one declared above.
          # ZNAS_MINIO_CACHE: MinIO no longer publishes its binaries; a fresh
          # rootfs gets the last ones from this folder on the runner.
          sudo -E WORK=/srv/usbbuild/work ZNAS_MINIO_CACHE=/srv/usbbuild/minio-cache \
            UBUNTU_VERSION="$APPLIANCE_UBUNTU_VERSION" APPLIANCE_BUILD="$APPLIANCE_BUILD" \
            INCUS_VERSION="$APPLIANCE_INCUS_VERSION" \
            ./build.sh --binary "$RUNNER_TEMP/bin/zfsnas" --test
          sudo chown "$(id -u):$(id -g)" znas-usb-appliance-v*.iso*
          ls -lh znas-usb-appliance-v*.iso*

      - name: Sign the image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CODE_SIGN_PRIVATE_KEY: ${{ secrets.CODE_SIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cd usbimage
          iso=$(ls -1v znas-usb-appliance-v*.iso | tail -n1)
          umask 077
          printf '%s' "$CODE_SIGN_PRIVATE_KEY" > "$RUNNER_TEMP/cosign.key"
          cosign sign-blob --key "$RUNNER_TEMP/cosign.key" --tlog-upload=false \
            --output-signature "$iso.sig" "$iso"
          rm -f "$RUNNER_TEMP/cosign.key"
          # Prove the portal will accept it before anything is published.
          cosign verify-blob --key "$RUNNER_TEMP/cosign.pub" --signature "$iso.sig" \
            --insecure-ignore-tlog=true "$iso"

      - name: Publish to the appliance repo
        env:
          GH_TOKEN: ${{ secrets.APPLIANCE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          cd usbimage
          INCUS_VERSION="$APPLIANCE_INCUS_VERSION" ./publish-iso.sh --repo "$APPLIANCE_REPO"

      - name: Remove the image from the runner
        if: always()
        run: sudo rm -f usbimage/znas-usb-appliance-v*.iso* "$RUNNER_TEMP/cosign.key"

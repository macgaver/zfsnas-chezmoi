# Managed by ZNAS Firewall — DHCP on VLAN800; rewritten on every apply and at boot.
port=0
bind-dynamic
except-interface=lo
interface=br-enp2s0-v800
log-facility=-
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/znas-sdn-if000800.leases
domain=chezmoi.lan
dhcp-range=set:if000800,10.128.8.100,10.128.8.199,255.255.255.0,12h
dhcp-option=tag:if000800,option:router,10.128.8.1
dhcp-option=tag:if000800,option:dns-server,10.128.8.1
dhcp-host=aa:bb:cc:dd:ee:01,10.128.8.8,plex

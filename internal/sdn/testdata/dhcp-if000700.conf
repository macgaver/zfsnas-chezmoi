# Managed by ZNAS Firewall — DHCP on VLAN700; rewritten on every apply and at boot.
port=0
bind-dynamic
except-interface=lo
interface=enp2s0-v700
log-facility=-
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/znas-sdn-if000700.leases
domain=chezmoi.lan
dhcp-range=set:if000700,10.128.7.50,10.128.7.60,255.255.255.0,12h
dhcp-option=tag:if000700,option:router,10.128.7.1
dhcp-option=tag:if000700,option:dns-server,10.128.8.4,10.128.8.33

# PCI passthrough: load the vfio stack at boot so IOMMU groups and the
# vfio-pci driver are present before the portal or Incus goes looking for
# them. The kernel cmdline carries intel_iommu=on / amd_iommu=on / iommu=pt
# (see usbimage/build.sh); these modules are what actually claim a device.
# Loading vfio-pci binds NOTHING on its own - no ids= here on purpose, so a
# passthrough is only ever set up deliberately from the UI.
vfio
vfio_iommu_type1
vfio-pci
